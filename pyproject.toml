[tool.poetry]
name = "fastapi-erp"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

fastapi = "^0.119"
uvicorn = { extras = ["standard"], version = "^0.37" }

sqlalchemy = "^2.1"
asyncpg = "^0.30"

python-dotenv = "^1.1"
pydantic = { version = "^2.11", extras = ["email"] }
requests = "^2.34.2"
psycopg = {extras = ["binary"], version = "^3.3.6"}
pyjwt = {extras = ["crypto"], version = "^2.15.1"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"